<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140726">
<title>Molecule Quest · Warriors Thrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="mq.css">
</head>
<body>
<div id="app">
  <div id="loading"><img src="obj/title.webp" alt=""><div class="bar"><i id="loadBar"></i></div></div>

  <!-- title -->
  <section id="title" class="screen hide">
    <div class="titleBg"></div>
    <button class="exit hide" id="exitBtn">← Back to app</button>
    <img class="wtlogo" src="../runner/img/logo.webp" alt="Warriors Thrive">
    <img class="titleImg" src="obj/title.webp" alt="Molecule Quest">
    <p class="tagline">Shrink down with Dr. Amos and the Warriors to see how sickle cell works, and how every medicine fights back.</p>
    <div class="crew" id="crew"></div>
    <button class="cta" id="startBtn">Start the quest ▶</button>
    <p class="progressTxt" id="progressTxt"></p>
  </section>

  <!-- map -->
  <section id="map" class="screen hide">
    <div class="mapTop"><button class="iconBtn" id="mapHome" aria-label="Home">⌂</button><div class="mapTitle"><b>Molecule Quest</b><small id="mapSub">0 of 10 boards</small></div><div class="crysCount"><img src="../runner/img/crystal.webp" alt=""><span id="mapCrys">0</span></div></div>
    <div class="mapScroll" id="mapScroll"><div class="mapInner" id="mapInner"><img src="bg/map.webp" alt="" class="mapImg" id="mapImg"></div></div>
  </section>

  <!-- board -->
  <section id="board" class="screen hide">
    <div class="boardBg" id="boardBg"></div>
    <div class="stage" id="stage"></div>
    <div class="boardTop">
      <button class="iconBtn" id="boardBack" aria-label="Back to map">←</button>
      <div class="boardTitle"><small id="bNum">Board 1</small><b id="bTitle">Build Hemoglobin</b></div>
      <div class="steps" id="bSteps"></div>
    </div>
    <div class="goal hide" id="goal"></div>
    <div class="hud hide" id="hud"></div>
  </section>

  <!-- dialogue -->
  <div id="talk" class="hide">
    <div class="talkWrap">
      <img id="talkImg" alt="">
      <div class="talkBox">
        <div class="talkName" id="talkName">Dr. Amos</div>
        <div class="talkText" id="talkText"></div>
        <div class="talkFoot"><span class="dots" id="talkDots"></span><button class="nextBtn" id="talkNext">Next ▶</button></div>
      </div>
    </div>
  </div>

  <!-- learn / quiz / reward panels -->
  <div id="panel" class="layer hide"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
</div>
<script src="mq.js"></script>
</body>
</html>
